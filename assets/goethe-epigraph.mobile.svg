<svg xmlns="http://www.w3.org/2000/svg" width="440" height="166" viewBox="0 0 440 166" role="img" aria-label="und ihr könnt sagen, ihr seid dabei gewesen."><style>text{font-family:Georgia,"Times New Roman",serif;font-style:italic;fill:#24292f}@media(prefers-color-scheme:dark){text{fill:#e6edf3}}</style><text x="220" y="65" dominant-baseline="middle" text-anchor="middle" font-size="24">und ihr könnt sagen,</text><text x="220" y="100" dominant-baseline="middle" text-anchor="middle" font-size="24">ihr seid dabei gewesen.</text></svg>
